services:
  # Backend API Service
  - type: web
    name: talking-head-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --reload
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PORT
        value: 8000
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: HOST
        value: 0.0.0.0
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: https://talking-head-frontend.onrender.com,https://talking-head-backend.onrender.com
      - key: CLIENT_URL
        value: https://talking-head-frontend.onrender.com
      - key: FRONTEND_URL
        value: https://talking-head-frontend.onrender.com
      - key: D_ID_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: CLOUDINARY_URL
        sync: false

  # Frontend Service
  - type: web
    name: talking-head-frontend
    env: static
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://talking-head-backend.onrender.com
      - key: VITE_API_TIMEOUT
        value: 30000
