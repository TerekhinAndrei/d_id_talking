<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Audio API Test</title>
</head>
<body>
    <h1>🎵 Web Audio API Test</h1>
    <p>Testing Web Audio API for chunk playback...</p>
    
    <button onclick="testWebAudioPlayback()">Test Web Audio API</button>
    <button onclick="testChunkPlayback()">Test Chunk Playback</button>
    
    <div id="status"></div>
    
    <script>
        let audioContext = null;
        let audioQueue = [];
        let isPlaying = false;
        
        function testWebAudioPlayback() {
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = '<p>🎵 Testing Web Audio API...</p>';
            
            // Создаем AudioContext
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            
            // Создаем тестовый аудио буфер
            const sampleRate = 44100;
            const duration = 0.5;
            const buffer = audioContext.createBuffer(1, sampleRate * duration, sampleRate);
            const channelData = buffer.getChannelData(0);
            
            for (let i = 0; i < channelData.length; i++) {
                channelData[i] = Math.sin(2 * Math.PI * 440 * i / sampleRate) * 0.3;
            }
            
            // Воспроизводим
            const source = audioContext.createBufferSource();
            source.buffer = buffer;
            source.connect(audioContext.destination);
            source.start(0);
            
            statusDiv.innerHTML += '<p>✅ Web Audio API test completed</p>';
        }
        
        function testChunkPlayback() {
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = '<p>🎵 Testing chunk playback...</p>';
            
            // Создаем AudioContext
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            
            // Создаем несколько чанков
            for (let i = 0; i < 3; i++) {
                const sampleRate = 44100;
                const duration = 0.2;
                const buffer = audioContext.createBuffer(1, sampleRate * duration, sampleRate);
                const channelData = buffer.getChannelData(0);
                
                for (let j = 0; j < channelData.length; j++) {
                    channelData[j] = Math.sin(2 * Math.PI * (440 + i * 100) * j / sampleRate) * 0.3;
                }
                
                // Конвертируем в ArrayBuffer
                const arrayBuffer = audioBufferToArrayBuffer(buffer);
                audioQueue.push(arrayBuffer);
            }
            
            statusDiv.innerHTML += '<p>📦 Created ' + audioQueue.length + ' audio chunks</p>';
            
            // Воспроизводим чанки последовательно
            playNextChunk();
        }
        
        function playNextChunk() {
            if (audioQueue.length === 0 || isPlaying) {
                return;
            }
            
            const audioData = audioQueue.shift();
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML += '<p>🎵 Playing chunk: ' + audioData.byteLength + ' bytes</p>';
            
            isPlaying = true;
            
            audioContext.decodeAudioData(audioData).then(decodedBuffer => {
                const source = audioContext.createBufferSource();
                source.buffer = decodedBuffer;
                source.connect(audioContext.destination);
                source.start(0);
                
                source.onended = () => {
                    console.log('✅ Chunk playback ended');
                    isPlaying = false;
                    
                    // Воспроизводим следующий чанк
                    if (audioQueue.length > 0) {
                        setTimeout(playNextChunk, 100);
                    } else {
                        statusDiv.innerHTML += '<p>✅ All chunks played</p>';
                    }
                };
                
            }).catch(error => {
                console.error('❌ Error decoding audio:', error);
                isPlaying = false;
                statusDiv.innerHTML += '<p>❌ Error decoding audio: ' + error.message + '</p>';
            });
        }
        
        function audioBufferToArrayBuffer(buffer) {
            const length = buffer.length;
            const numberOfChannels = buffer.numberOfChannels;
            const sampleRate = buffer.sampleRate;
            const arrayBuffer = new ArrayBuffer(44 + length * numberOfChannels * 2);
            const view = new DataView(arrayBuffer);
            
            // WAV header
            const writeString = (offset, string) => {
                for (let i = 0; i < string.length; i++) {
                    view.setUint8(offset + i, string.charCodeAt(i));
                }
            };
            
            writeString(0, 'RIFF');
            view.setUint32(4, 36 + length * numberOfChannels * 2, true);
            writeString(8, 'WAVE');
            writeString(12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, numberOfChannels, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * numberOfChannels * 2, true);
            view.setUint16(32, numberOfChannels * 2, true);
            view.setUint16(34, 16, true);
            writeString(36, 'data');
            view.setUint32(40, length * numberOfChannels * 2, true);
            
            // Audio data
            let offset = 44;
            for (let i = 0; i < length; i++) {
                for (let channel = 0; channel < numberOfChannels; channel++) {
                    const sample = Math.max(-1, Math.min(1, buffer.getChannelData(channel)[i]));
                    view.setInt16(offset, sample * 0x7FFF, true);
                    offset += 2;
                }
            }
            
            return arrayBuffer;
        }
    </script>
</body>
</html>
