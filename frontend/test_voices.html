<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Voices API</title>
</head>
<body>
    <h1>Test Voices API</h1>
    <button onclick="testVoices()">Test Voices API</button>
    <div id="result"></div>

    <script>
        async function testVoices() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Loading...';
            
            try {
                const response = await fetch('/api/v1/generation/voices');
                const data = await response.json();
                
                if (data.success && data.voices) {
                    resultDiv.innerHTML = `
                        <h3>✅ Success!</h3>
                        <p>Loaded ${data.voices.length} voices</p>
                        <ul>
                            ${data.voices.slice(0, 5).map(voice => 
                                `<li><strong>${voice.name}</strong> - ${voice.description}</li>`
                            ).join('')}
                        </ul>
                        <p>... and ${data.voices.length - 5} more voices</p>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <h3>❌ Error</h3>
                        <p>Invalid response format</p>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <h3>❌ Error</h3>
                    <p>${error.message}</p>
                `;
            }
        }
    </script>
</body>
</html>
