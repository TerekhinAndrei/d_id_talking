<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Playback Test</title>
</head>
<body>
    <h1>🎵 Audio Playback Test</h1>
    <p>Testing immediate audio chunk playback...</p>
    
    <button onclick="testAudioPlayback()">Test Audio Playback</button>
    
    <div id="status"></div>
    
    <script>
        function testAudioPlayback() {
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = '<p>🎵 Testing audio playback...</p>';
            
            // Создаем тестовый аудио чанк (синусоида)
            const sampleRate = 44100;
            const duration = 0.5; // 0.5 секунды
            const frequency = 440; // A4 note
            
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const buffer = audioContext.createBuffer(1, sampleRate * duration, sampleRate);
            const channelData = buffer.getChannelData(0);
            
            for (let i = 0; i < channelData.length; i++) {
                channelData[i] = Math.sin(2 * Math.PI * frequency * i / sampleRate) * 0.3;
            }
            
            // Конвертируем в WAV
            const wavBuffer = audioBufferToWav(buffer);
            const blob = new Blob([wavBuffer], { type: 'audio/wav' });
            
            console.log('🎵 Created test audio blob:', blob.size, 'bytes');
            
            // Воспроизводим сразу
            const audioUrl = URL.createObjectURL(blob);
            const audio = new Audio(audioUrl);
            
            audio.oncanplaythrough = () => {
                console.log('✅ Audio ready to play');
                statusDiv.innerHTML += '<p>✅ Audio ready to play</p>';
            };
            
            audio.play().then(() => {
                console.log('🎵 Audio playback started');
                statusDiv.innerHTML += '<p>🎵 Audio playback started</p>';
            }).catch(error => {
                console.error('❌ Error playing audio:', error);
                statusDiv.innerHTML += '<p>❌ Error playing audio: ' + error.message + '</p>';
            });
            
            audio.onended = () => {
                console.log('✅ Audio playback ended');
                statusDiv.innerHTML += '<p>✅ Audio playback ended</p>';
                URL.revokeObjectURL(audioUrl);
            };
            
            audio.onerror = (error) => {
                console.error('❌ Audio error:', error);
                statusDiv.innerHTML += '<p>❌ Audio error: ' + error.message + '</p>';
                URL.revokeObjectURL(audioUrl);
            };
        }
        
        function audioBufferToWav(buffer) {
            const length = buffer.length;
            const numberOfChannels = buffer.numberOfChannels;
            const sampleRate = buffer.sampleRate;
            const arrayBuffer = new ArrayBuffer(44 + length * numberOfChannels * 2);
            const view = new DataView(arrayBuffer);
            
            // WAV header
            const writeString = (offset, string) => {
                for (let i = 0; i < string.length; i++) {
                    view.setUint8(offset + i, string.charCodeAt(i));
                }
            };
            
            writeString(0, 'RIFF');
            view.setUint32(4, 36 + length * numberOfChannels * 2, true);
            writeString(8, 'WAVE');
            writeString(12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, numberOfChannels, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * numberOfChannels * 2, true);
            view.setUint16(32, numberOfChannels * 2, true);
            view.setUint16(34, 16, true);
            writeString(36, 'data');
            view.setUint32(40, length * numberOfChannels * 2, true);
            
            // Audio data
            let offset = 44;
            for (let i = 0; i < length; i++) {
                for (let channel = 0; channel < numberOfChannels; channel++) {
                    const sample = Math.max(-1, Math.min(1, buffer.getChannelData(channel)[i]));
                    view.setInt16(offset, sample * 0x7FFF, true);
                    offset += 2;
                }
            }
            
            return arrayBuffer;
        }
    </script>
</body>
</html>
