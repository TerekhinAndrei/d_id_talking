<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Improved Audio Playback Test</title>
</head>
<body>
    <h1>🎵 Improved Audio Playback Test</h1>
    <p>Testing improved audio queue and playback system...</p>
    
    <button onclick="testImprovedPlayback()">Test Improved Playback</button>
    <button onclick="testQueueManagement()">Test Queue Management</button>
    
    <div id="status"></div>
    
    <script>
        let audioContext = null;
        let audioQueue = [];
        let isPlaying = false;
        
        function testImprovedPlayback() {
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = '<p>🎵 Testing improved audio playback...</p>';
            
            // Создаем AudioContext
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            
            // Очищаем очередь
            audioQueue = [];
            isPlaying = false;
            
            // Создаем несколько тестовых аудио чанков
            for (let i = 0; i < 5; i++) {
                const sampleRate = 44100;
                const duration = 0.3;
                const buffer = audioContext.createBuffer(1, sampleRate * duration, sampleRate);
                const channelData = buffer.getChannelData(0);
                
                for (let j = 0; j < channelData.length; j++) {
                    channelData[j] = Math.sin(2 * Math.PI * (440 + i * 100) * j / sampleRate) * 0.3;
                }
                
                // Конвертируем в ArrayBuffer
                const arrayBuffer = audioBufferToArrayBuffer(buffer);
                const blob = new Blob([arrayBuffer], { type: 'audio/wav' });
                audioQueue.push(blob);
            }
            
            statusDiv.innerHTML += '<p>📦 Created ' + audioQueue.length + ' audio chunks</p>';
            
            // Начинаем воспроизведение
            playNextChunk();
        }
        
        function playNextChunk() {
            // Проверяем, есть ли аудио в очереди
            if (audioQueue.length === 0) {
                isPlaying = false;
                document.getElementById('status').innerHTML += '<p>✅ All chunks played</p>';
                return;
            }
            
            // Берем первый аудио-кусок из очереди
            const audioBlob = audioQueue.shift();
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML += '<p>📦 Dequeued chunk. Queue size: ' + audioQueue.length + '</p>';
            
            // Преобразуем Blob в ArrayBuffer
            audioBlob.arrayBuffer().then(arrayBuffer => {
                // Декодируем аудио данные
                audioContext.decodeAudioData(arrayBuffer).then(decodedBuffer => {
                    // Создаем источник звука
                    const source = audioContext.createBufferSource();
                    source.buffer = decodedBuffer;
                    source.connect(audioContext.destination);
                    
                    // Начинаем воспроизведение
                    source.start(0);
                    isPlaying = true;
                    
                    statusDiv.innerHTML += '<p>🎵 Playing chunk...</p>';
                    
                    // Когда воспроизведение этого куска закончится, проигрываем следующий
                    source.onended = () => {
                        console.log('✅ Audio chunk playback ended. Playing next chunk...');
                        isPlaying = false;
                        playNextChunk();
                    };
                    
                }).catch(error => {
                    console.error('❌ Ошибка декодирования аудио:', error);
                    statusDiv.innerHTML += '<p>❌ Error decoding audio: ' + error.message + '</p>';
                    playNextChunk();
                });
            }).catch(error => {
                console.error('❌ Ошибка чтения Blob:', error);
                statusDiv.innerHTML += '<p>❌ Error reading blob: ' + error.message + '</p>';
                playNextChunk();
            });
        }
        
        function testQueueManagement() {
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = '<p>🧪 Testing queue management...</p>';
            
            // Тестируем управление очередью
            audioQueue = [];
            isPlaying = false;
            
            statusDiv.innerHTML += '<p>✅ Queue cleared</p>';
            statusDiv.innerHTML += '<p>📊 Queue size: ' + audioQueue.length + '</p>';
            statusDiv.innerHTML += '<p>🎵 Is playing: ' + isPlaying + '</p>';
            
            // Добавляем тестовые элементы
            for (let i = 0; i < 3; i++) {
                const testBlob = new Blob(['test' + i], { type: 'text/plain' });
                audioQueue.push(testBlob);
            }
            
            statusDiv.innerHTML += '<p>📦 Added 3 test items to queue</p>';
            statusDiv.innerHTML += '<p>📊 Queue size: ' + audioQueue.length + '</p>';
            
            // Симулируем воспроизведение
            while (audioQueue.length > 0) {
                const item = audioQueue.shift();
                statusDiv.innerHTML += '<p>🎵 Processing item: ' + item.size + ' bytes</p>';
            }
            
            statusDiv.innerHTML += '<p>✅ Queue processing completed</p>';
        }
        
        function audioBufferToArrayBuffer(buffer) {
            const length = buffer.length;
            const numberOfChannels = buffer.numberOfChannels;
            const sampleRate = buffer.sampleRate;
            const arrayBuffer = new ArrayBuffer(44 + length * numberOfChannels * 2);
            const view = new DataView(arrayBuffer);
            
            // WAV header
            const writeString = (offset, string) => {
                for (let i = 0; i < string.length; i++) {
                    view.setUint8(offset + i, string.charCodeAt(i));
                }
            };
            
            writeString(0, 'RIFF');
            view.setUint32(4, 36 + length * numberOfChannels * 2, true);
            writeString(8, 'WAVE');
            writeString(12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, numberOfChannels, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * numberOfChannels * 2, true);
            view.setUint16(32, numberOfChannels * 2, true);
            view.setUint16(34, 16, true);
            writeString(36, 'data');
            view.setUint32(40, length * numberOfChannels * 2, true);
            
            // Audio data
            let offset = 44;
            for (let i = 0; i < length; i++) {
                for (let channel = 0; channel < numberOfChannels; channel++) {
                    const sample = Math.max(-1, Math.min(1, buffer.getChannelData(channel)[i]));
                    view.setInt16(offset, sample * 0x7FFF, true);
                    offset += 2;
                }
            }
            
            return arrayBuffer;
        }
    </script>
</body>
</html>
